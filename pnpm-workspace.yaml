packages:
  - "apps/*" # Matches all apps in the "apps" folder
  - "."

# node_modules is bind-mounted between the devcontainer (linux) and the host (macOS),
# so native binaries (oxlint, esbuild, lightningcss, ...) are installed for both
supportedArchitectures:
  os:
    - current
    - darwin
  cpu:
    - current
