name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      HUSKY: 0 # the changesets action commits in CI: developer git hooks (lint on commit) must not run there
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: 24.18.0 # or your desired version

      # the version comes from "packageManager" in package.json, so CI never jumps to a new major on its own
      - name: Install PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Dependencies (Root)
        run: pnpm install

      - name: Generate Contentlayer Types (Frontend App)
        run: pnpm contentlayer2 build
        working-directory: apps/frontend

      - name: Create Release Pull Request
        uses: changesets/action@v1
        with:
          commit: "release(app): 🚀 release version"
          publish: "pnpm run publish"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
